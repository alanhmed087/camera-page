```html
<!DOCTYPE html>
<html lang="ku">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camera</title>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #111;
  color: white;
  padding: 25px;
}

h1 {
  font-size: 32px;
}

video {
  width: 100%;
  max-width: 500px;
  border-radius: 15px;
  background: #222;
}

button {
  margin: 10px;
  padding: 14px 22px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

</style>

</head>

<body>

<h1>کامێرا 📷</h1>

<video id="video" autoplay playsinline></video>

<br>

<button onclick="startCamera()">
کردنەوەی کامێرا 📷
</button>

<script>

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true
      });

    document.getElementById("video").srcObject = stream;

  } catch (error) {

    alert("تکایە مۆڵەتی کامێرا بدە.");

    console.error(error);

  }

}

window.addEventListener("load", startCamera);

</script>

</body>

</html>
```

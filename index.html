<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>Camera</title>

<style>

body {

    margin: 0;

    background: #111;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

}

button {

    padding: 16px 28px;

    font-size: 18px;

    border: none;

    border-radius: 12px;

    cursor: pointer;

}

video,

canvas {

    display: none;

}

</style>

</head>

<body>

<button id="capture">Click</button>

<video

    id="video"

    autoplay

    playsinline>

</video>

<canvas id="canvas"></canvas>

<script>

const video =

document.getElementById("video");

const canvas =

document.getElementById("canvas");

const button =

document.getElementById("capture");

let stream = null;

async function startCamera() {

    try {

        stream =

        await navigator.mediaDevices

        .getUserMedia({

            video: {

                facingMode: "user"

            }

        });

        video.srcObject = stream;

    } catch (error) {

        console.log(error);

    }

}

button.addEventListener("click", () => {

    if (!stream) return;

    canvas.width =

    video.videoWidth;

    canvas.height =

    video.videoHeight;

    const ctx =

    canvas.getContext("2d");

    ctx.drawImage(

        video,

        0,

        0

    );

    const image =

    canvas.toDataURL("image/jpeg");

    const link =

    document.createElement("a");

    link.href = image;

    link.download =

    "photo.jpg";

    link.click();

});

startCamera();

</script>

</body>

</html>
